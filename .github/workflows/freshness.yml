# The weekly freshness audit: does the derived layer still match the research structure?
# Two jobs on the pin-bump pattern: the audit runs at read scope and produces a report;
# the reporter alone holds issues: write, triggers only on schedule or a main-guarded
# dispatch, and handles the report as data. Neither is a required check.
name: freshness
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.audit.outputs.findings }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: self-test, then audit
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/freshness.py --self-test
          set +e
          python3 tests/freshness.py > freshness-report.md
          code=$?
          set -e
          cat freshness-report.md
          if [ "$code" -eq 1 ]; then echo "findings=yes" >> "$GITHUB_OUTPUT"; else echo "findings=no" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness-report.md

  freshness-report:
    needs: freshness-audit
    if: needs.freshness-audit.outputs.findings == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freshness-report
      - name: file or update the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "Freshness audit in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file freshness-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Freshness audit" --body-file freshness-report.md
          fi
