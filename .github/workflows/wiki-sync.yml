name: wiki-sync

# The repository holds the wiki's source; the hosted wiki is the build product.
# This runs after a merge, never on a pull request, so nothing a contributor can
# submit reaches it — a pull-request event would hand the write scope below to
# whatever a fork's branch contains.
on:
  push:
    branches: [main]
    paths: ['wiki/**']

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  wiki-sync:
    name: wiki-sync
    runs-on: ubuntu-latest
    # The one job in this repository holding write scope, enumerated by name in
    # AGENTS.md's Security section, which is where the four conditions on such a
    # grant are stated: push-only trigger, publishes rather than adjudicates, the
    # run token rather than a stored credential, and the grant on the job so a
    # second job added here does not inherit it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish wiki/ to the hosted wiki and verify it landed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/wiki-sync.sh
