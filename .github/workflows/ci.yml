name: ci

on:
  push:
    branches: [main]
  # `edited` is load-bearing for the attribution gate: it reads the pull-request
  # body from the event payload, and GitHub's re-run replays the original
  # payload. Without `edited`, a body fixed after a failure would need an empty
  # commit to be seen.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# The repository's verdicts must not be forgeable by anything a contributor can
# submit. CI therefore holds no secrets and no write scope, permanently: raising
# this is prohibited by AGENTS.md, not a maintenance decision.
permissions:
  contents: read

jobs:
  path-gate:
    name: path-gate — proof-layer PRs may not touch the specification layer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/path_gate.py --self-test
      - run: python3 tests/path_gate.py

  dco:
    name: dco — every commit carries a sign-off
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/dco.py --self-test
      - run: python3 tests/dco.py
      - run: python3 tests/attribution.py --self-test
      - run: python3 tests/attribution.py

  checkers:
    name: checkers — house harness self-test and the claims registries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m checkers.run --self-test
      - run: python3 tests/contrib_hygiene.py --self-test
      - run: python3 tests/contrib_hygiene.py
      - run: python3 -m checkers.run

  conservativity:
    name: conservativity — no new axioms, specification shape unchanged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/conservativity.py --self-test
      - run: python3 tests/conservativity.py

  python:
    name: python — project test runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/name_lint.py --self-test
      - run: python3 tests/name_lint.py
      - run: python3 tests/run.py

  lean:
    name: lean — build, sorry-free, axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Mathlib oleans
        working-directory: lean
        run: lake exe cache get

      - name: Build, within the time budget
        working-directory: lean
        # Budget is a specification-layer value (AGENTS.md). A pull request that
        # needs more is a conversation, not an override.
        timeout-minutes: 25
        run: lake build

      - name: Axiom audit
        working-directory: lean
        run: |
          python3 ../tests/audit_axioms.py --self-test
          python3 ../tests/audit_axioms.py

  frozen-integrity:
    name: frozen-integrity — digests and the manifest rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/check_frozen.py --self-test
      - run: python3 tests/check_frozen.py

  foundations-verification:
    name: foundations-verification — the frozen consolidation re-proves itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run from a copy: the gate must not be able to mutate frozen content,
      # and a runner that writes anything would otherwise drift the tree hash.
      - name: Verify the frozen consolidation, read-only
        run: |
          cp -R frozen/consolidation_aug9 "$RUNNER_TEMP/consolidation_aug9"
          cd "$RUNNER_TEMP/consolidation_aug9"
          python3 tests/run.py

      - name: Confirm the frozen tree was not modified
        run: python3 tests/check_frozen.py
