name = "workspace"
defaultTargets = ["Workspace"]

# Formalized-Agent-Foundations, pinned to a specific commit.
# Mathlib and Foundation arrive transitively through it, so this repo pins one
# dependency and inherits a consistent solver stack rather than pinning three.
[[require]]
name = "agentFoundations"
git = "https://github.com/A-M-Berns/Formalized-Agent-Foundations.git"
rev = "307119d06ac882359f1e7d1773b295b55a9be5ee"

[[lean_lib]]
name = "Workspace"
globs = ["Workspace.+"]
